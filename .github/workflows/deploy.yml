# Deploys the site to GitHub Pages: on every push to main, on demand, and from
# "Update league data" after it commits new data (a commit made by a workflow
# doesn't trigger other workflows, so that one calls this directly).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main, so a deploy called right after a data commit includes it.
          ref: main

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html roster.html standings.html stats.html roster.json .nojekyll assets css js data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

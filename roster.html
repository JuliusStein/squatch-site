<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster · Salem Sasquatch Hockey</title>
  <meta name="description" content="Players and staff of the Salem Sasquatch semi-pro hockey team.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./">
        <img src="assets/logo.png" alt="Salem Sasquatch logo" width="56" height="56">
        <span class="brand-name">Salem <strong>Sasquatch</strong></span>
      </a>
      <div id="record" class="record" hidden></div>
      <nav class="nav">
        <a href="./#schedule">Schedule</a>
        <a href="roster.html" aria-current="page">Roster</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="eyebrow" id="roster-season">Season</p>
        <h1>Roster</h1>
      </div>
    </section>

    <section class="roster">
      <div class="wrap">
        <table class="roster-table">
          <thead>
            <tr><th scope="col" class="col-num">#</th><th scope="col">Name</th><th scope="col">Position</th></tr>
          </thead>
          <tbody id="roster-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© <span id="year"></span> Salem Sasquatch Hockey · Salem Icenter, Salem, NH</p>
    </div>
  </footer>

  <script src="js/record.js"></script>
  <script src="js/roster.js"></script>
</body>
</html>
